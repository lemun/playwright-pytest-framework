name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  offline:
    name: Unit + offline integration (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps --only-shell chromium
      # Live e2e tests are collected but skipped (QA_RUN_E2E is unset).
      - run: uv run pytest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-offline-py${{ matrix.python }}
          path: reports/
          retention-days: 14

  e2e:
    name: Live e2e (saucedemo.com, headless)
    # Depends on a third-party site, so it runs only when started from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    env:
      QA_RUN_E2E: "1"
      QA_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps --only-shell chromium
      - run: uv run pytest -m e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-e2e
          path: reports/
          retention-days: 14
