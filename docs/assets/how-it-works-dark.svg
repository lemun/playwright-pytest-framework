<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How playwright-pytest-framework works</title><desc id="desc">Typed data cases feed shared journeys, StoreFlow, page objects and Playwright. The same journeys execute offline against a routed fake store or live against saucedemo.com. Live runs are opt-in. Reports include Allure, HTML and JUnit XML, with screenshots and traces on failure.</desc><rect x="0" y="0" width="1600" height="800" rx="24" fill="#0E131B"/><text x="64" y="90" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">Shared journeys. Offline and live.</text><text x="64" y="139" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#B4C0D2">Data-driven cases run through the same flow and page objects.</text><rect x="64" y="220" width="340" height="144" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="88" y="262" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Shared journeys</text><text x="88" y="301" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#56D8F2">tests/journeys.py</text><text x="88" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B4C0D2">Sorting, cart, checkout, personas</text><rect x="460" y="220" width="300" height="144" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="484" y="262" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">StoreFlow</text><text x="484" y="301" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#56D8F2">flows/store_flow.py</text><text x="484" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B4C0D2">Compose shared user steps</text><rect x="816" y="220" width="320" height="144" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="840" y="262" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Page objects</text><text x="840" y="301" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#56D8F2">pages/ + BasePage</text><text x="840" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B4C0D2">Locators, waits, navigation</text><rect x="1192" y="220" width="344" height="144" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="1216" y="262" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Playwright</text><text x="1216" y="301" font-family="Consolas, Menlo, monospace" font-size="20" font-weight="400" fill="#56D8F2">BrowserContext + Page</text><text x="1216" y="337" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#B4C0D2">Drive a real browser</text><path d="M413 290H450m-9 -7 9 7-9 7" fill="none" stroke="#B4C0D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M769 290H806m-9 -7 9 7-9 7" fill="none" stroke="#B4C0D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1145 290H1182m-9 -7 9 7-9 7" fill="none" stroke="#B4C0D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="64" y="466" width="480" height="136" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="88" y="508" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Typed cases</text><text x="88" y="547" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#56D8F2">JSON / YAML / CSV</text><text x="88" y="580" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B4C0D2">Orders, sorting, forms and personas</text><path d="M234 466V376m-7 10 7-10 7 10" fill="none" stroke="#B4C0D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1364 364V406H872V474m-7 -10 7 10 7-10" fill="none" stroke="#56D8F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M1328 406V474m-7 -10 7 10 7-10" fill="none" stroke="#7FAEFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="668" y="396" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#B4C0D2">Two execution targets</text><rect x="668" y="486" width="408" height="138" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="692" y="528" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Offline fake store</text><text x="692" y="568" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#56D8F2">context.route interception</text><text x="692" y="601" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B4C0D2">Other requests are aborted</text><rect x="1120" y="486" width="416" height="138" rx="16" fill="#171F2B" stroke="#364456" stroke-width="2"/><text x="1144" y="528" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Live practice store</text><text x="1144" y="568" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#7FAEFF">saucedemo.com</text><text x="1144" y="601" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#B4C0D2">Opt-in: QA_RUN_E2E=1</text><path d="M64 664H1536" fill="none" stroke="#364456" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="712" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Reports &amp; failure evidence</text><text x="64" y="753" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#B4C0D2">Allure · HTML · JUnit XML    |    Screenshots + Playwright traces on failure</text></svg>